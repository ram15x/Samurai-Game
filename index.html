<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Samurai Duel: a 2D fighting game for one or two players, built with TypeScript and the Canvas API."
    />
    <title>Samurai Duel</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230d0b14'/><path d='M3 13 12 4l1 1-9 9z' fill='%23fff'/><path d='M2 12l2 2' stroke='%23fbbf24' stroke-width='2'/></svg>"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <div id="stage">
        <canvas id="game" width="1024" height="576"></canvas>

        <div id="hud" hidden>
          <div class="bars">
            <div class="side p1">
              <div class="health">
                <div class="ghost" id="p1-ghost"></div>
                <div class="fill" id="p1-health"></div>
              </div>
              <div class="meta">
                <span id="p1-name"></span>
                <span class="pips" id="p1-pips"></span>
              </div>
            </div>
            <div id="timer">60</div>
            <div class="side p2">
              <div class="health">
                <div class="ghost" id="p2-ghost"></div>
                <div class="fill" id="p2-health"></div>
              </div>
              <div class="meta">
                <span class="pips" id="p2-pips"></span>
                <span id="p2-name"></span>
              </div>
            </div>
          </div>
          <div id="message"></div>
        </div>

        <section id="menu" class="overlay">
          <h1>SAMURAI<br /><span>DUEL</span></h1>
          <p id="loading">LOADING...</p>
          <div id="menu-body" hidden>
            <div class="row">
              <button type="button" data-mode="cpu" class="primary">1 PLAYER</button>
              <button type="button" data-mode="versus">2 PLAYERS</button>
            </div>
            <div class="row difficulty" role="radiogroup" aria-label="CPU difficulty">
              <span>CPU</span>
              <button type="button" role="radio" data-difficulty="easy">EASY</button>
              <button type="button" role="radio" data-difficulty="normal">NORMAL</button>
              <button type="button" role="radio" data-difficulty="hard">HARD</button>
            </div>
            <table class="controls">
              <thead>
                <tr>
                  <th></th>
                  <th>P1</th>
                  <th>P2</th>
                </tr>
              </thead>
              <tbody>
                <tr><td>MOVE</td><td>A D</td><td>&larr; &rarr;</td></tr>
                <tr><td>JUMP</td><td>W</td><td>&uarr;</td></tr>
                <tr><td>BLOCK</td><td>S</td><td>&darr;</td></tr>
                <tr><td>LIGHT</td><td>F</td><td>K</td></tr>
                <tr><td>HEAVY</td><td>G</td><td>L</td></tr>
              </tbody>
            </table>
            <p class="small">ESC PAUSE &middot; M MUTE</p>
          </div>
        </section>

        <section id="pause" class="overlay" hidden>
          <h2>PAUSED</h2>
          <div class="row">
            <button type="button" id="resume" class="primary">RESUME</button>
            <button type="button" id="quit">MENU</button>
          </div>
        </section>

        <section id="result" class="overlay" hidden>
          <h2 id="result-title"></h2>
          <p id="result-score"></p>
          <div class="row">
            <button type="button" id="rematch" class="primary">REMATCH</button>
            <button type="button" id="to-menu">MENU</button>
          </div>
        </section>
      </div>
      <p class="footer">
        First to win 2 rounds takes the match. Hold jump for a higher jump, block to take less
        damage.
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
